server {
    listen 80;
    listen  [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Flutter web payload is heavy JS/WASM/fonts — serve it compressed
    # (~10 MB raw becomes ~3 MB on the wire).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/octet-stream
        font/ttf
        font/otf
        image/svg+xml
        text/javascript
        text/css
        text/plain;

    # Renderer engines change only with a Flutter upgrade — cache them hard.
    location /canvaskit/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
