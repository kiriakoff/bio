name: Build and deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger deployment
    needs: build
    runs-on: ubuntu-latest
    steps:
      # DEPLOY_TOKEN is a fine-grained PAT for kiriakoff/ansible-master with
      # the contents:write permission — it may only trigger the deploy
      # pipeline there, nothing else.
      - name: Dispatch to ansible-master
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          repository: kiriakoff/ansible-master
          event-type: Deploy role
          client-payload: >-
            {
              "role": "bio",
              "limit": "fornex"
            }
